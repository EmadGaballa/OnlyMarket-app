spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: WARN
    com.platform.ecommerce: INFO
