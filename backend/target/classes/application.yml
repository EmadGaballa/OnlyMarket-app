spring:
  application:
    name: ecommerce-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # File Upload Limits
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  # Hibernate Batch Fetching Optimization (Fixes N+1 for collections)
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 20

  # OpenAPI / Swagger
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: method
      tags-sorter: alpha
    api-docs:
      path: /v3/api-docs

# App Specific Configurations
app:
  jwt:
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789abcdef}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  dummyjson:
    base-url: https://dummyjson.com
  rate-limit:
    login-per-minute: 5
    register-per-minute: 3
    forgot-password-per-minute: 3

# Actuator Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized