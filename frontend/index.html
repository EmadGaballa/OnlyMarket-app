<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- 🏷️ Brand Title & Core Meta -->
    <title>OnlyMarket — Modern Digital Marketplace</title>
    <meta
      name="description"
      content="Discover, buy, and sell seamlessly on OnlyMarket. Explore curated products, trusted sellers, and fast checkout."
    />
    <meta name="application-name" content="OnlyMarket" />

    <!-- 🎨 Browser UI & Mobile Theme Color (Adapts to System Light/Dark) -->
    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0f17"
      media="(prefers-color-scheme: dark)"
    />

    <!-- ===================================================================
         FAVICONS & PLATFORM ICONS
         =================================================================== -->

    <!-- 1. Modern Browsers (Instant Data-URI SVG Favicon with your Store Icon) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z'/%3E%3Cpath d='M7 13.5L12 10l5 3.5'/%3E%3Cpath d='M9.5 21v-5a2.5 2.5 0 0 1 5 0v5'/%3E%3C/svg%3E"
    />

    <!-- 2. Standard Static Favicons (Assets placed in public/ folder) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- 3. Apple iOS Home Screen Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- 4. Android Chrome / PWA Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 5. Windows Tile Icon -->
    <meta name="msapplication-TileColor" content="#2563eb" />

    <!-- ===================================================================
         OPEN GRAPH / SOCIAL PREVIEWS
         =================================================================== -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="OnlyMarket — Modern Digital Marketplace"
    />
    <meta
      property="og:description"
      content="Discover, buy, and sell seamlessly on OnlyMarket."
    />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OnlyMarket — Modern Digital Marketplace"
    />
    <meta
      name="twitter:description"
      content="Discover, buy, and sell seamlessly on OnlyMarket."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
